<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>نظام تنظيم قسم التسويق</title>
<meta name="description" content="نظام تنظيم قسم التسويق — لوحة تحكم وخطة محتوى ومهام وفريق">
<link rel="icon" href="assets/logo.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
<script>try{if(localStorage.getItem('moa.theme')==='dark')document.documentElement.setAttribute('data-theme','dark');}catch(e){}</script>
</head>
<body>
<div id="splash" class="splash" aria-hidden="true">
  <div class="splash-box"><span class="splash-ring"></span><img src="assets/logo.png" alt=""></div>
</div>
<div class="print-header print-only" id="printHeader"></div>
<div class="app">
  <header class="topbar">
    <div class="topbar-title">
      <h1 class="page-title" id="pageTitle">لوحة التحكم</h1>
    </div>
    <input id="globalSearch" class="global-search" type="search" placeholder="بحث في المحتوى والمهام…" aria-label="بحث شامل">
    <div class="topbar-actions">
      <button class="icon-btn" id="btnAlerts" aria-label="التنبيهات" title="تنبيهات المهام">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg>
        <span class="dot-badge" id="alertsBadge" hidden></span>
      </button>
      <button class="icon-btn theme-toggle" id="themeToggle" aria-label="تبديل الوضع الليلي" title="الوضع الليلي">
        <svg class="ico-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><line x1="12" y1="2" x2="12" y2="5"/><line x1="12" y1="19" x2="12" y2="22"/><line x1="2" y1="12" x2="5" y2="12"/><line x1="19" y1="12" x2="22" y2="12"/><line x1="4.6" y1="4.6" x2="6.7" y2="6.7"/><line x1="17.3" y1="17.3" x2="19.4" y2="19.4"/><line x1="4.6" y1="19.4" x2="6.7" y2="17.3"/><line x1="17.3" y1="6.7" x2="19.4" y2="4.6"/></svg>
        <svg class="ico-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      </button>
      <button class="btn btn-ghost" id="btnPdf" title="طباعة الواجهة الحالية أو حفظها PDF">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:16px;height:16px"><polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg>
        PDF
      </button>
      <button class="btn btn-ghost" id="btnImport">استيراد</button>
      <button class="btn btn-primary" id="btnExport">تصدير</button>
      <div class="avatar" title="الحساب" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>
      </div>
    </div>
  </header>

  <nav class="sidenav" id="sidenav">
    <div class="sidenav-head">
      <div class="brand-mark"><img src="assets/logo.png" alt="شعار نظام تنظيم قسم التسويق"></div>
      <div class="brand-text">
        <div class="brand-title">قسم التسويق</div>
        <div class="brand-sub">نظام التنظيم</div>
      </div>
    </div>
    <button class="nav-item is-active" data-view="dashboard">
      <span class="nav-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/></svg></span>
      <span>لوحة التحكم</span>
    </button>
    <button class="nav-item" data-view="assistant">
      <span class="nav-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3l1.6 3.9L17.5 8l-3 2.6.8 4.1L12 12.9 8.7 14.7l.8-4.1-3-2.6 3.9-1.1z"/><path d="M5 17l.7 1.8L7.5 19.5l-1.8.7L5 22l-.7-1.8L2.5 19.5l1.8-.7z"/></svg></span>
      <span>المساعد الذكي</span>
    </button>
    <button class="nav-item" data-view="content">
      <span class="nav-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="3" y1="9" x2="21" y2="9"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="16" y1="2" x2="16" y2="6"/></svg></span>
      <span>خطة المحتوى</span>
    </button>
    <button class="nav-item" data-view="calendar">
      <span class="nav-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="3" y1="10" x2="21" y2="10"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="7" y1="14" x2="9" y2="14"/><line x1="11" y1="14" x2="13" y2="14"/><line x1="15" y1="14" x2="17" y2="14"/></svg></span>
      <span>تقويم المحتوى</span>
    </button>
    <button class="nav-item" data-view="tasks">
      <span class="nav-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 11 12 14 20 6"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg></span>
      <span>المهام</span>
      <span class="nav-badge" id="tasksBadge" hidden></span>
    </button>
    <button class="nav-item" data-view="kanban">
      <span class="nav-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="5" height="16" rx="1.5"/><rect x="10" y="4" width="5" height="10" rx="1.5"/><rect x="17" y="4" width="4" height="13" rx="1.5"/></svg></span>
      <span>لوحة كانبان</span>
    </button>
    <button class="nav-item" data-view="gantt">
      <span class="nav-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="6" x2="14" y2="6"/><line x1="7" y1="12" x2="20" y2="12"/><line x1="5" y1="18" x2="12" y2="18"/></svg></span>
      <span>المخطط الزمني</span>
    </button>
    <button class="nav-item" data-view="team">
      <span class="nav-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg></span>
      <span>الفريق</span>
    </button>
    <button class="nav-item" data-view="settings">
      <span class="nav-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="4" y1="21" x2="4" y2="14"/><line x1="4" y1="10" x2="4" y2="3"/><line x1="12" y1="21" x2="12" y2="12"/><line x1="12" y1="8" x2="12" y2="3"/><line x1="20" y1="21" x2="20" y2="16"/><line x1="20" y1="12" x2="20" y2="3"/><line x1="1.5" y1="14" x2="6.5" y2="14"/><line x1="9.5" y1="8" x2="14.5" y2="8"/><line x1="17.5" y1="16" x2="22.5" y2="16"/></svg></span>
      <span>الإعدادات والقوائم</span>
    </button>
    <button class="nav-item" data-view="help">
      <span class="nav-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg></span>
      <span>كيفية الاستخدام</span>
    </button>
    <button class="nav-cta" id="ctaAssistant">
      <span class="cta-spark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3l1.6 3.9L17.5 8l-3 2.6.8 4.1L12 12.9 8.7 14.7l.8-4.1-3-2.6 3.9-1.1z"/></svg></span>
      <span class="cta-title">المساعد الذكي</span>
      <span class="cta-sub">دع الذكاء الاصطناعي ينظّم مهامك ومحتواك</span>
      <span class="cta-btn">ابدأ المحادثة</span>
    </button>
    <div class="nav-foot">نظام تنظيم قسم التسويق · إصدار 1.0</div>
  </nav>

  <main class="content" id="view"></main>
</div>

<nav class="bottom-nav" id="bottomNav" aria-label="تنقّل سريع">
  <button class="bn-item" data-view="dashboard">
    <span class="bn-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/></svg></span>
    <span class="bn-label">الرئيسية</span>
  </button>
  <button class="bn-item" data-view="tasks">
    <span class="bn-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 11 12 14 20 6"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg></span>
    <span class="bn-label">المهام</span>
    <span class="bn-badge" id="tasksBadgeBn" hidden></span>
  </button>
  <button class="bn-item" data-view="content">
    <span class="bn-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="3" y1="9" x2="21" y2="9"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="16" y1="2" x2="16" y2="6"/></svg></span>
    <span class="bn-label">المحتوى</span>
  </button>
  <button class="bn-item" data-view="assistant">
    <span class="bn-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3l1.6 3.9L17.5 8l-3 2.6.8 4.1L12 12.9 8.7 14.7l.8-4.1-3-2.6 3.9-1.1z"/></svg></span>
    <span class="bn-label">المساعد</span>
  </button>
  <button class="bn-item bn-more" id="bnMore" aria-haspopup="true">
    <span class="bn-ico"><svg viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg></span>
    <span class="bn-label">المزيد</span>
  </button>
</nav>

<div class="sheet-scrim" id="sheetScrim"></div>
<div class="sheet" id="moreSheet" role="dialog" aria-label="المزيد">
  <div class="sheet-handle"></div>
  <div class="sheet-title">كل الصفحات</div>
  <div class="sheet-grid">
    <button class="sheet-item" data-view="calendar"><span class="si-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="3" y1="10" x2="21" y2="10"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="16" y1="2" x2="16" y2="6"/></svg></span><span>تقويم المحتوى</span></button>
    <button class="sheet-item" data-view="kanban"><span class="si-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="5" height="16" rx="1.5"/><rect x="10" y="4" width="5" height="10" rx="1.5"/><rect x="17" y="4" width="4" height="13" rx="1.5"/></svg></span><span>لوحة كانبان</span></button>
    <button class="sheet-item" data-view="gantt"><span class="si-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="6" x2="14" y2="6"/><line x1="7" y1="12" x2="20" y2="12"/><line x1="5" y1="18" x2="12" y2="18"/></svg></span><span>المخطط الزمني</span></button>
    <button class="sheet-item" data-view="team"><span class="si-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg></span><span>الفريق</span></button>
    <button class="sheet-item" data-view="settings"><span class="si-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="4" y1="21" x2="4" y2="14"/><line x1="4" y1="10" x2="4" y2="3"/><line x1="12" y1="21" x2="12" y2="12"/><line x1="12" y1="8" x2="12" y2="3"/><line x1="20" y1="21" x2="20" y2="16"/><line x1="20" y1="12" x2="20" y2="3"/><line x1="1.5" y1="14" x2="6.5" y2="14"/><line x1="9.5" y1="8" x2="14.5" y2="8"/><line x1="17.5" y1="16" x2="22.5" y2="16"/></svg></span><span>الإعدادات</span></button>

  </div>
</div>

<div class="scrim" id="scrim"></div>
<input type="file" id="importFile" accept="application/json,.json" hidden>
<div class="toast-wrap" id="toastWrap"></div>

<script src="js/data.js"></script>
<script src="js/state.js"></script>
<script src="js/compute.js"></script>
<script src="js/charts.js"></script>
<script src="js/tables.js"></script>
<script src="js/ai.js"></script>
<script src="js/views.js"></script>
<script src="js/app.js"></script>
</body>
</html>
